<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Léonore Vanier</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F5F1E9;color:#302824;font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:34rem}
  h1{margin:0 0 .5rem;font:500 clamp(2.4rem,8vw,4rem)/1.05 "Cormorant Garamond",Georgia,serif}
  a{color:#654653}
  a:focus-visible{outline:3px solid #654653;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>
  <p>Cette page n’existe pas ou a été déplacée.</p>
  <p><a id="home" href="/">Retour à l’accueil</a></p>
</main>
<script>
  // GitHub Pages sert cette page à toutes les profondeurs : on calcule le lien d’accueil.
  // Si le dépôt a un autre nom que ci-dessous, adapter REPO (voir README).
  (function () {
    var REPO = "leonore_vanier";
    var parts = location.pathname.split("/");
    var base = parts[1] === REPO ? "/" + REPO + "/" : "/";
    document.getElementById("home").setAttribute("href", base);
  })();
</script>
</body>
</html>
